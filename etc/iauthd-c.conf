/* iauthd-c config for the Undernet development environment.
 *
 * ircd forks /opt/iauthd/libexec/iauthd-c over stdin/stdout (see IAuth in
 * etc/leaf.conf / etc/hub.conf). Config is bind-mounted from etc/iauthd-c.conf.
 */

core {
    library_path ( "/opt/iauthd/lib/iauthd-c" )
    // iauth_class assigns ircd Class names; iauth_xquery can talk to gnuworld.
    modules ( iauth_xquery, iauth_class )
}

logs {
    // Absolute path: ircd starts iauthd with -n (no chdir).
    "*.>=info" "file:/tmp/iauthd-c.log"
}

iauth {
    // Soft timeout: accept if only soft holds remain (e.g. unanswered XQUERY).
    timeout 15
}

iauth_xquery {
    channels.undernet.org combined
}

iauth_class {
    // Prefer Simulation when XQUERY to gnuworld succeeded.
    "r100" { class Simulation; xreply_ok "channels.undernet.org" }
    // Catch-all so clients still register if XQUERY is slow/unavailable.
    "r900" { class Simulation }
}
